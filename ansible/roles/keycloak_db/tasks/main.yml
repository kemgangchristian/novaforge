- name: Lancer PostgreSQL pour Keycloak
  community.docker.docker_container:
    name: "{{ keycloak_db_container_name }}"
    image: "{{ keycloak_db_image }}"
    restart_policy: unless-stopped
    env:
      POSTGRES_DB: "{{ keycloak_db_name }}"
      POSTGRES_USER: "{{ keycloak_db_user }}"
      POSTGRES_PASSWORD: "{{ keycloak_db_password }}"
    volumes:
      - "{{ keycloak_db_volume }}:/var/lib/postgresql/data"
    networks:
      - name: "{{ platform_network_name }}"
    # Contrôle de santé : la base accepte-t-elle les connexions ?
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ keycloak_db_user }} -d {{ keycloak_db_name }}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      project: "novaforge"
    state: started

- name: Attendre que PostgreSQL soit prêt
  community.docker.docker_container_info:
    name: "{{ keycloak_db_container_name }}"
  register: keycloak_db_info
  until: keycloak_db_info.container.State.Health.Status == "healthy"
  retries: 12
  delay: 5
  