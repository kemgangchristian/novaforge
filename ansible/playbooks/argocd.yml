- name: Installer Argo CD sur le cluster prod
  hosts: workstation
  gather_facts: false

  tasks:
    - name: Créer l'espace de noms argocd
      ansible.builtin.command:
        cmd: "kubectl --context k3d-prod apply -f {{ platform_home }}/deploy/prod/namespace.yaml"
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout or 'configured' in ns_apply.stdout"

    - name: Installer Argo CD 3.5.5
      ansible.builtin.command:
        cmd: >-
          kubectl --context k3d-prod apply
          --server-side --force-conflicts
          -n argocd
          -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
      register: argocd_apply
      changed_when: "'serverside-applied' in argocd_apply.stdout or 'created' in argocd_apply.stdout"
