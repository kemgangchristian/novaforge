apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novaforge-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kemgangchristian/novaforge.git
    targetRevision: main
    path: deploy/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
