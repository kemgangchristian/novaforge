- name: Déployer l'application sur le cluster staging
  hosts: workstation
  gather_facts: false

  tasks:
    - name: Appliquer les manifestes
      ansible.builtin.command:
        cmd: "kubectl --context k3d-staging apply -f {{ platform_home }}/deploy/staging"
      register: kubectl_apply
      changed_when: "'created' in kubectl_apply.stdout or 'configured' in kubectl_apply.stdout"
